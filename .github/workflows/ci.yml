name: CI

on:
  push:
    branches: [main]
  pull_request:

# Mínimo privilegio del GITHUB_TOKEN (ADR 0264): CI solo lee el código.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TEST_DATABASE_URL: postgres://dizaster:dizaster@localhost:5432/dizaster_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: PostgreSQL 16 + PostGIS + H3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16 postgresql-16-postgis-3 postgresql-16-h3
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE ROLE dizaster LOGIN SUPERUSER PASSWORD 'dizaster';"
          sudo -u postgres psql -c "CREATE DATABASE dizaster_test OWNER dizaster;"

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:boundaries
      - run: pnpm check:secrets
      - run: pnpm check:workflows
      - run: pnpm typecheck
      - run: pnpm build
      - name: Servidor compatible con S3 para probar el cliente de almacenamiento
        run: |
          pipx install --quiet "moto[server]"
          nohup ~/.local/bin/moto_server -p 9900 > /tmp/moto.log 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:9900/ >/dev/null && break; sleep 1; done
      - run: pnpm test
        env:
          S3_TEST_ENDPOINT: http://127.0.0.1:9900
      - name: Prueba de restauración del respaldo (pg_dump → base temporal → mismas filas)
        run: pnpm db:restore-check
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Empaquetado móvil (JS, iOS + Android)
        working-directory: apps/mobile
        run: pnpm run bundle:check

      - name: Proyectos nativos iOS + Android (paridad de permisos, push y enlaces)
        working-directory: apps/mobile
        run: pnpm run native:check

  # Dizaster Delivery Control Plane (Blueprint §20, ADR 0265): impacto, política y documentación del cambio, con
  # registro de auditoría. Determinístico, sin IA ni credenciales.
  delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DZD_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dizaster/delivery build
      - name: Impacto y gates elegidos
        run: pnpm dzd inspect && pnpm dzd plan
      - name: Política (block detiene el cambio)
        run: pnpm dzd policy --env staging
      - name: Documentación que acompaña al cambio
        run: pnpm dzd docs
      - name: Informe del cambio (Markdown, para el comentario del PR cuando exista el repositorio)
        run: pnpm dzd report --out delivery-report.md
      - name: Auditoría
        if: always()
        run: pnpm dzd audit --actor delivery-plane --action ci --result ${{ job.status == 'success' && 'ok' || 'failed' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: delivery-audit
          path: |
            delivery-audit.jsonl
            delivery-report.md

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Licencias permitidas y avisos de seguridad (ADR 0070)
        run: pnpm supply-chain
      - run: pnpm sbom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

  # Escáneres open source (ADR 0266). Imágenes fijadas por digest y herramientas por versión exacta.
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Gitleaks (historial completo)
        run: >-
          docker run --rm -v "$PWD:/src:ro" -w /src
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --config .gitleaks.toml --redact --no-banner .
      - name: Trivy (dependencias, Dockerfiles e IaC, HIGH y CRITICAL)
        run: >-
          docker run --rm -v "$PWD:/src:ro"
          aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --exit-code 1 --quiet /src
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.27.1
          cache: false
      - name: OSV-Scanner (avisos de OSV.dev sobre pnpm-lock.yaml)
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.6.0
          "$(go env GOPATH)/bin/osv-scanner" scan source --lockfile pnpm-lock.yaml
      - name: Semgrep (reglas propias, bloqueantes)
        run: >-
          pipx run semgrep==1.178.0 scan --config .semgrep/dizaster.yml --metrics=off --error
          services packages tools apps/mobile/src
      - name: Semgrep (reglas públicas de TypeScript, informativas)
        continue-on-error: true
        run: pipx run semgrep==1.178.0 scan --config p/typescript --metrics=off services packages tools apps/mobile/src

  # Infraestructura como código (ADR 0267): formato, validación con el esquema real del proveedor, IAM y escaneo.
  # Sin credenciales ni backend: nunca hay `plan` contra la nube ni `apply` aquí.
  iac:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.0
          tofu_wrapper: false
      - run: tofu fmt -check -recursive infra/tofu
      - name: tofu validate (staging y producción)
        run: |
          for env in staging production; do
            tofu -chdir=infra/tofu/envs/$env init -backend=false -input=false
            tofu -chdir=infra/tofu/envs/$env validate
          done
          tofu -chdir=infra/tofu/bootstrap init -backend=false -input=false
          tofu -chdir=infra/tofu/bootstrap validate
      - name: tofu test (stack con proveedor simulado, sin credenciales; ADR 0278)
        run: |
          tofu -chdir=infra/tofu/modules/stack init -backend=false -input=false
          tofu -chdir=infra/tofu/modules/stack test
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dizaster/delivery build
      - name: IAM sin roles amplios ni acceso público sin marca
        run: pnpm dzd iac-check --hcl "$(find infra/tofu -name '*.tf' -not -path '*/.terraform/*' | paste -sd, -)"

  # Imagen del backend (ADR 0267): se construye en cada cambio, se escanea, lleva SBOM y manifiesto verificable.
  # Se sube, firma (cosign keyless) y atesta solo en main y con Google Cloud activado (D-18, ADR 0277).
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [check, security]
    # id-token solo aquí: firma keyless de Sigstore y WIF de Google (ADR 0277). Ningún otro job lo recibe.
    permissions:
      contents: read
      id-token: write
    env:
      # Publicar y firmar solo en main y solo cuando Google Cloud esté activado (D-18) y el repositorio registrado (D-24).
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_WIF_PROVIDER != '' }}
      REGISTRY: ${{ vars.GCP_STAGING_REGISTRY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dizaster/delivery build
      - name: Build (formato OCI, con digest de manifiesto)
        run: |
          docker buildx create --use --driver docker-container
          docker buildx build -f infra/docker/core.Dockerfile --output type=oci,dest=core.oci.tar .
          tar -xOf core.oci.tar index.json | jq -r '.manifests[0].digest' > image-digest.txt
      - name: Vulnerabilidades de la imagen (HIGH y CRITICAL con arreglo disponible)
        run: >-
          docker run --rm -v "$PWD:/w" -w /w
          aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          image --input core.oci.tar --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --quiet
      - name: SBOM de la imagen (CycloneDX)
        run: >-
          docker run --rm -v "$PWD:/w" -w /w
          aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          image --input core.oci.tar --format cyclonedx --output core.sbom.cdx.json --quiet
      - name: Manifiesto y verificación
        run: |
          pnpm dzd artifact --file core.oci.tar --name core --version "${GITHUB_SHA::12}" --commit "$GITHUB_SHA" \
            --image-digest "$(cat image-digest.txt)" --sbom core.sbom.cdx.json --tests passed --security passed
          pnpm dzd artifact verify --file core.oci.tar --manifest core.oci.tar.manifest.json
      - name: Procedencia SLSA v1 (predicado para cosign attest)
        run: pnpm dzd provenance --manifest core.oci.tar.manifest.json --image dizaster/core --predicate --out core.provenance.json
      - name: Google Cloud por WIF (dz-ci-images, solo main)
        if: env.PUBLISH == 'true'
        id: gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
          token_format: access_token
      - if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Publicar por digest, firmar y adjuntar procedencia y SBOM
        if: env.PUBLISH == 'true'
        env:
          TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: |
          D="$(cat image-digest.txt)"
          echo "$TOKEN" | docker login -u oauth2accesstoken --password-stdin "${REGISTRY%%/*}"
          # --all y --preserve-digests: el digest en el registro es el mismo que se escaneó y se describió.
          skopeo copy --all --preserve-digests --authfile ~/.docker/config.json oci-archive:core.oci.tar "docker://$REGISTRY/core:${GITHUB_SHA::12}"
          cosign sign --yes "$REGISTRY/core@$D"
          cosign attest --yes --type slsaprovenance1 --predicate core.provenance.json "$REGISTRY/core@$D"
          cosign attest --yes --type cyclonedx --predicate core.sbom.cdx.json "$REGISTRY/core@$D"
          pnpm dzd signature verify --image "$REGISTRY/core" --digest "$D" --attestations --execute
          echo "### Imagen publicada y firmada: \`$REGISTRY/core@$D\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-image
          path: |
            core.oci.tar.manifest.json
            core.sbom.cdx.json
            core.provenance.json
            image-digest.txt
