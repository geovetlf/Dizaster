# Entrega de una imagen que CI ya construyó, escaneó, firmó y atestó en main (ADR 0277, Blueprint §20.13).
# CÓDIGO → CI → PRUEBAS → SEGURIDAD → BUILD → SBOM → FIRMA → REGISTRO → STAGING → VERIFICACIÓN → PROMOCIÓN →
# PRODUCCIÓN → MONITOREO → ROLLBACK. Nunca se reconstruye: producción recibe el mismo digest que pasó staging.
#
# Inactivo hasta que existan los proyectos de Google Cloud (D-18), el repositorio (D-24) y los entornos de GitHub
# `staging` y `production` (este último con el propietario como revisor obligatorio). Ver
# docs/runbooks/activacion-bloqueos.md. Claude nunca puede aprobar el entorno production.
name: deliver

on:
  workflow_dispatch:
    inputs:
      digest:
        description: "Digest sha256 de la imagen firmada por CI en main"
        required: true
        type: string
      promote:
        description: "Promover a producción después de staging (pide aprobación del propietario)"
        type: boolean
        default: false

permissions:
  contents: read

# Una entrega a la vez; nunca se cancela una a medias (dejaría tráfico partido).
concurrency:
  group: deliver
  cancel-in-progress: false

jobs:
  # Antes de tocar nada: la entrega corre desde main; main exige PR y los 7 checks; staging acepta solo ramas
  # protegidas; y si se promueve, production pide la aprobación de un owner sin bypass de administradores y acepta
  # solo ramas protegidas (ADR 0303 y 0306). Lee la API con el token del workflow; falla cerrado si no puede leerla.
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dizaster/delivery build
      - name: Reglas de main y entornos staging y production
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PROMOTE: ${{ inputs.promote }}
        run: |
          # Cada lectura deja el cuerpo en <archivo> o, si gh falla, el error en <archivo>.err: la guarda distingue
          # "no existe" (404) de "no se pudo verificar" y en los dos casos detiene la entrega (ADR 0306).
          read_api() { if gh api "$1" > "$2" 2> "$2.err"; then rm -f "$2.err"; fi; }
          read_api "repos/$REPO/rules/branches/main" main-rules.json
          read_api "repos/$REPO/environments/staging" staging.json
          args=(--ref "$GITHUB_REF" --rules main-rules.json --staging staging.json)
          if [ "$PROMOTE" = "true" ]; then
            read_api "repos/$REPO/environments/production" production.json
            args+=(--production production.json)
          fi
          pnpm dzd github-guard "${args[@]}"

  staging:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      DIGEST: ${{ inputs.digest }}
      REGISTRY: ${{ vars.GCP_STAGING_REGISTRY }}
      PROJECT: ${{ vars.GCP_PROJECT }}
      REGION: ${{ vars.GCP_REGION }}
      API_URL: ${{ vars.API_URL }}
      STATE: ${{ vars.DELIVERY_STATE_BUCKET }}
      # Solo cuenta como humano si está en owners de delivery/policy.json (ADR 0277).
      ACTOR: github:${{ github.triggering_actor }}
    steps:
      - name: Digest con formato válido
        run: '[[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::digest inválido"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dizaster/delivery build
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Historial de versiones y auditoría
        run: |
          gcloud storage cp "gs://$STATE/delivery/staging/delivery-releases.jsonl" . 2>/dev/null || touch delivery-releases.jsonl
          gcloud storage cp "gs://$STATE/delivery/staging/delivery-audit.jsonl" . 2>/dev/null || touch delivery-audit.jsonl
          pnpm dzd audit verify
      - name: Firma, procedencia y SBOM (solo imágenes de CI en main)
        run: |
          gcloud auth configure-docker "${REGISTRY%%/*}" --quiet
          pnpm dzd signature verify --image "$REGISTRY/core" --digest "$DIGEST" --attestations --execute
      - name: Migraciones (compatibles hacia atrás; job de Cloud Run con la misma imagen)
        run: |
          gcloud run jobs update migrate --image="$REGISTRY/core@$DIGEST" --project "$PROJECT" --region "$REGION" --quiet
          gcloud run jobs execute migrate --wait --project "$PROJECT" --region "$REGION" --quiet
      - name: API — revisión sin tráfico, verificación, 10 %, 100 %, rollback automático
        run: >-
          pnpm dzd deploy --env staging --digest "$DIGEST" --image "$REGISTRY/core" --project "$PROJECT" --region "$REGION"
          --url "$API_URL" --actor "$ACTOR" --execute
      - name: Worker con la misma imagen
        # Comando de worker pools a confirmar en la primera activación (Cloud Run worker pools, ADR 0267).
        run: gcloud beta run worker-pools update worker --image="$REGISTRY/core@$DIGEST" --project "$PROJECT" --region "$REGION" --quiet
      - name: SLO de la revisión (p95 < 300 ms, sin 5xx)
        run: pnpm dzd verify --url "$API_URL" --repeat 5 --slo
      - name: Guardar historial y auditoría
        if: always()
        run: |
          gcloud storage cp delivery-releases.jsonl delivery-audit.jsonl "gs://$STATE/delivery/staging/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: delivery-staging
          path: |
            delivery-releases.jsonl
            delivery-audit.jsonl

  production:
    if: inputs.promote
    needs: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Revisor obligatorio: el propietario. Sin su aprobación este job no empieza.
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      DIGEST: ${{ inputs.digest }}
      SOURCE: ${{ vars.GCP_STAGING_REGISTRY }}
      REGISTRY: ${{ vars.GCP_PRODUCTION_REGISTRY }}
      PROJECT: ${{ vars.GCP_PROJECT }}
      REGION: ${{ vars.GCP_REGION }}
      API_URL: ${{ vars.API_URL }}
      STATE: ${{ vars.DELIVERY_STATE_BUCKET }}
      # Solo cuenta como humano si está en owners de delivery/policy.json (ADR 0277).
      ACTOR: github:${{ github.triggering_actor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dizaster/delivery build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: delivery-staging
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Historial de producción
        run: |
          gcloud storage cp "gs://$STATE/delivery/production/delivery-releases.jsonl" prod-releases.jsonl 2>/dev/null || touch prod-releases.jsonl
          # El historial de staging de esta entrega prueba que el digest pasó staging; el de producción da el rollback.
          cat prod-releases.jsonl delivery-releases.jsonl > merged.jsonl && mv merged.jsonl delivery-releases.jsonl
          # La auditoría es una cadena por entorno: se continúa la de producción, no la de staging.
          rm -f delivery-audit.jsonl
          gcloud storage cp "gs://$STATE/delivery/production/delivery-audit.jsonl" . 2>/dev/null || touch delivery-audit.jsonl
          pnpm dzd audit verify
      - name: Copiar el mismo digest con sus firmas (sin reconstruir)
        run: |
          gcloud auth configure-docker "${SOURCE%%/*},${REGISTRY%%/*}" --quiet
          cosign copy "$SOURCE/core@$DIGEST" "$REGISTRY/core"
      - name: Migraciones
        run: |
          gcloud run jobs update migrate --image="$REGISTRY/core@$DIGEST" --project "$PROJECT" --region "$REGION" --quiet
          gcloud run jobs execute migrate --wait --project "$PROJECT" --region "$REGION" --quiet
      - name: Promoción gradual con verificación y rollback automático
        run: >-
          pnpm dzd promote --digest "$DIGEST" --image "$REGISTRY/core" --project "$PROJECT" --region "$REGION"
          --url "$API_URL" --actor "$ACTOR" --outcome approval --execute
      - name: Worker con la misma imagen
        run: gcloud beta run worker-pools update worker --image="$REGISTRY/core@$DIGEST" --project "$PROJECT" --region "$REGION" --quiet
      - name: SLO de la revisión
        run: pnpm dzd verify --url "$API_URL" --repeat 5 --slo
      - name: Guardar historial y auditoría
        if: always()
        run: gcloud storage cp delivery-releases.jsonl delivery-audit.jsonl "gs://$STATE/delivery/production/"
