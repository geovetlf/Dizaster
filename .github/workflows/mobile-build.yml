# Compilación nativa en la nube con EAS Build: iOS y Android desde el mismo código, sin Mac propio.
# Solo manual (workflow_dispatch) para no consumir cupo de builds en cada push (cost-first).
# Requiere el secreto EXPO_TOKEN y las variables DIZASTER_EAS_PROJECT_ID / DIZASTER_EXPO_OWNER
# (ver docs/MOBILE_PLATFORMS.md). Las credenciales de firma las gestiona EAS, nunca el repositorio.
name: mobile-build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Plataforma
        type: choice
        options: [all, android, ios]
        default: all
      profile:
        description: Perfil de eas.json
        type: choice
        options: [development, ios-simulator, preview, production]
        default: preview

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      DIZASTER_EAS_PROJECT_ID: ${{ vars.DIZASTER_EAS_PROJECT_ID }}
      DIZASTER_EXPO_OWNER: ${{ vars.DIZASTER_EXPO_OWNER }}
      DIZASTER_API_URL: ${{ vars.DIZASTER_API_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Comprobar credenciales
        run: |
          test -n "$EXPO_TOKEN" || { echo "::error::Falta el secreto EXPO_TOKEN"; exit 1; }
          test -n "$DIZASTER_EAS_PROJECT_ID" || { echo "::error::Falta la variable DIZASTER_EAS_PROJECT_ID"; exit 1; }
      - run: pnpm run sync-data
      - name: EAS Build
        run: npx --yes eas-cli@24.8.0 build --platform "${{ inputs.platform }}" --profile "${{ inputs.profile }}" --non-interactive --no-wait
