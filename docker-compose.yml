# Entorno local mínimo (cost-first): una base de datos, una API y un worker. Nada más.
services:
  db:
    build: { context: ., dockerfile: infra/docker/db.Dockerfile }
    environment:
      POSTGRES_USER: dizaster
      POSTGRES_PASSWORD: dizaster
      POSTGRES_DB: dizaster_dev
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dizaster"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., dockerfile: infra/docker/core.Dockerfile }
    command: ["node", "dist/migrate-cli.js"]
    environment: &coreenv
      NODE_ENV: development
      DATABASE_URL: postgres://dizaster:dizaster@db:5432/dizaster_dev
      AUTH_JWT_SECRET: change-me-dev-only-32-characters-min
      DEV_AUTH_ENABLED: "true"
    depends_on: { db: { condition: service_healthy } }

  api:
    build: { context: ., dockerfile: infra/docker/core.Dockerfile }
    environment: *coreenv
    ports: ["8080:8080"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: unless-stopped
    # Vivo = /health. /health/ready (worker y outbox) es para el monitor externo, no para reiniciar la API.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: { context: ., dockerfile: infra/docker/core.Dockerfile }
    command: ["node", "--import", "./dist/telemetry.js", "dist/worker.js"]
    environment: *coreenv
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: unless-stopped
    # Latido propio (ADR 0187): falla si algún bucle de esta instancia deja de latir.
    healthcheck:
      test: ["CMD", "node", "dist/worker-health-cli.js"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  dbdata:
