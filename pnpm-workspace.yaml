packages:
  - packages/*
  - services/*
  - apps/*
  - tools/*
patchedDependencies:
  expo-location@57.0.20: patches/expo-location@57.0.20.patch
# Arreglos de seguridad en dependencias transitivas (OSV-Scanner, ver vendor/README.md).
overrides:
  source-map-js@<1.2.2: ^1.2.2
  xcode>uuid: ^11.1.1
  query-string>decode-uri-component: file:./vendor/decode-uri-component
  # node-forge <=1.4.0 (GHSA-86w9 y otros, sin parche en 1.4.0): 1.4.1+ corrige todos; solo @expo/cli (herramienta de desarrollo).
  node-forge: 1.4.2
  # vite 8.3.1-8.3.2 (vitest, solo pruebas): GHSA-587h y otros, corregidos en 8.3.3.
  vite: 8.3.5
  # zod 3.x (solo @expo/cli): GHSA-mrhx, sin parche en la rama 3; la rama 4 corrige.
  zod@<4: 4.6.7
